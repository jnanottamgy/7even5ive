name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # The one to install: optimised, so the blur and animations run smoothly.
      - name: Build demo APK
        run: ./gradlew --no-daemon assembleDemo

      - name: Lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: 7even5ive-apk
          path: android/app/build/outputs/apk/demo/app-demo.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: 7even5ive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
