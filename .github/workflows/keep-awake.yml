name: Keep the online server awake

# Render's free plan puts a web service to sleep after 15 idle minutes, and waking it takes up
# to a minute: too slow for a demo. This asks its health endpoint every 10 minutes. Set the
# repository variable SEVENFIVE_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://7even5ive.onrender.com; without it this does nothing.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          URL: ${{ vars.SEVENFIVE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "SEVENFIVE_URL is not set; nothing to do."; exit 0; fi
          curl -fsS --max-time 90 --retry 2 "$URL/api/health"
