[project]
name = "mailfilter"
version = "0.1.0"
description = "Reads a student's college mail twice a day and keeps placements, internships and exam-cell notices as cards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "mcp>=1.2",
    "anthropic[bedrock]>=1.0",
]

[project.scripts]
mailfilter = "mailfilter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailfilter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["mailfilter"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: calls Claude on Bedrock (opt-in with RUN_EVALS=1)"]
