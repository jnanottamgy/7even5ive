[project]
name = "portmax"
version = "0.1.0"
description = "Turns a college portal into five read-only tools with one shape for every college."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
]

[project.optional-dependencies]
# The forge's engineer step: reverse-api-engineer, pinned because PortMax swaps its prompts.
forge = ["reverse-api-engineer==0.16.0"]

[project.scripts]
portmax = "portmax.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "playwright==1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portmax"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["portmax"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "mcp.*", "reverse_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives a real Chromium through Playwright (slower)"]
