org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The online server (core/seventy5/cloud.py, e.g. on Render): one HTTPS address for the core,
# PortMax and the portal. When set, the app works anywhere with internet and needs no setup.
# Empty: the app looks for a laptop instead (sevenfive.defaultHost, then a search of its Wi-Fi).
sevenfive.defaultServer=https://fl4el8s1h4.execute-api.ap-southeast-2.amazonaws.com
# A real college portal build. Uncomment both to point the WebView at the college's own portal
# (college must have a connector under portmax/.../connectors/) while uploads still go to
# defaultServer above. Left commented, the app uses the demo server's mock portal.
#   sevenfive.college=msrit
#   sevenfive.portal=https://parents.msrit.edu
# Where the debug build looks first when there is no online server. 10.0.2.2 is the laptop as seen from the emulator; on a
# real phone, change it in the app (Settings) to the laptop's LAN IP. No rebuild needed.
sevenfive.defaultHost=10.0.2.2
# The prototype's one demo student (docs/android.md, section 5). Not a secret.
sevenfive.studentToken=demo-student-token

# Firebase Cloud Messaging, only to wake the phone when the outbox has something (no content goes
# through Google). From the Firebase console: Project settings -> General -> your Android app.
# All four empty: no Firebase; the app still pulls every 15 minutes. Not secrets.
sevenfive.fcmAppId=
sevenfive.fcmApiKey=
sevenfive.fcmProjectId=
sevenfive.fcmSenderId=
