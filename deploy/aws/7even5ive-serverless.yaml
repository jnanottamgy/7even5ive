AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  7even5ive serverless: one HTTPS address (an API Gateway HTTP API) in front of two Lambda
  functions running the same code (handler seventy5.lambda_demo.handler, zip from
  core/build_lambda_zip.py). ApiFunction answers the app, the bot and ElevenLabs webhooks, MCP
  and its sign-in, and runs the once-a-minute tick (reminders, urgent calls, college mail,
  Classroom); it scales out, its data in Supabase. DemoFunction answers everything else: the
  demo's mock college portal, whose logins live in memory, so it is kept to one instance.

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket, in this same region, holding 7even5ive-lambda.zip.
  CodeKey:
    Type: String
    Default: 7even5ive-lambda.zip
    Description: The zip's name in that bucket.
  PinToOneInstance:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      true keeps the demo's mock college portal (DemoFunction) on one instance: its logins live
      in memory. Needs a Lambda concurrency quota of at least 101 in this region (AWS keeps 100
      unreserved; the usual quota is 1000). false works on any account, but the demo portal's
      login may then fail now and then.
  ApiOnOneInstance:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      true only while Supabase isn't set up (no DATABASE_URL): the app's data then lives in one
      instance's /tmp, so the API must stay on that one instance (and the quota must be at least
      102 with PinToOneInstance). With Supabase, leave false: requests never wait for each other.
  SettingsPath:
    Type: String
    Default: /7even5ive-demo
    AllowedPattern: "^/[A-Za-z0-9_./-]+[A-Za-z0-9_-]$"
    Description: >-
      Parameter Store path (this region) holding the keys as SecureStrings, one per name, e.g.
      /7even5ive-demo/ELEVENLABS_API_KEY. Read at every cold start. See docs/keys.md.
  TickEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      true runs the background jobs once a minute (reminders, calls, the 1 PM and 9 PM mail
      check, Classroom). false: nothing fires on its own.

Conditions:
  Pin: !Equals [!Ref PinToOneInstance, "true"]
  PinApi: !Equals [!Ref ApiOnOneInstance, "true"]
  Tick: !Equals [!Ref TickEnabled, "true"]

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: settings-and-models
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The keys: only this path, read-only. SecureStrings under the AWS-managed key
              # (aws/ssm) need no KMS statement.
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SettingsPath}
              # Claude on Bedrock: the cascade and the mail judge both call Bedrock's Messages
              # API (the SDK signs those requests for the service bedrock-mantle); InvokeModel
              # stays for older setups. Inference profiles route across regions, hence "*".
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock-mantle:*
                Resource: "*"

  # The catch-all behind the address: the demo's mock college portal (and anything not routed
  # to ApiFunction below). Its logical name is the first version's, so an existing stack keeps
  # its address when it is updated to this template.
  DemoFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: 7even5ive mock college portal for the demo (seventy5.lambda_demo)
      Runtime: python3.12
      Architectures: [x86_64]   # what build_lambda_zip.py packages and what was tested
      Handler: seventy5.lambda_demo.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 1024          # more memory is more CPU: a quicker cold start
      Timeout: 29               # API Gateway answers within 30 s
      ReservedConcurrentExecutions: !If [Pin, 1, !Ref "AWS::NoValue"]
      LoggingConfig:
        LogFormat: JSON         # keeps each log line's fields (job, error, counts)
      Environment:
        Variables:
          PYTHONDONTWRITEBYTECODE: "1"
          SSM_PREFIX: !Ref SettingsPath

  # The app's API, the webhooks, MCP and its sign-in, and the tick. Scales out (its data is in
  # Supabase); 60 s so a tick's last network call finishes rather than being cut off (API
  # Gateway still answers the phone within 30 s).
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: 7even5ive app API, webhooks, MCP, sign-in and background jobs (seventy5.lambda_demo)
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: seventy5.lambda_demo.handler
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 1024
      Timeout: 60
      ReservedConcurrentExecutions: !If [PinApi, 1, !Ref "AWS::NoValue"]
      LoggingConfig:
        LogFormat: JSON
      Environment:
        Variables:
          PYTHONDONTWRITEBYTECODE: "1"
          SSM_PREFIX: !Ref SettingsPath

  # A tick that fails or meets a busy function is not retried or queued: the next one comes a
  # minute later, and every job is safe to run again then.
  ApiAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ApiFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 120

  # Kept a week; the app logs counts and ids only, never message or mail text.
  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DemoFunction}
      RetentionInDays: 7

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 7

  # Quick create: a $default route to DemoFunction (the mock portal's /index.php and anything
  # else) and an auto-deployed $default stage. The routes below send the app's paths to
  # ApiFunction; both run the same code, which routes by path again (cloud.py).
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: 7even5ive-demo
      ProtocolType: HTTP
      Target: !GetAtt DemoFunction.Arn

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DemoFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ApiFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  RouteApi:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/{proxy+}
      Target: !Sub integrations/${ApiIntegration}

  RouteBot:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /bot/{proxy+}
      Target: !Sub integrations/${ApiIntegration}

  RoutePortMax:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /v1/{proxy+}
      Target: !Sub integrations/${ApiIntegration}

  RouteDemo:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /demo/{proxy+}
      Target: !Sub integrations/${ApiIntegration}

  RouteMcp:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /mcp
      Target: !Sub integrations/${ApiIntegration}

  RouteSignIn:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /oauth/{proxy+}
      Target: !Sub integrations/${ApiIntegration}

  # The background loop of a long-running server, as a schedule, on ApiFunction.
  TickRule:
    Type: AWS::Events::Rule
    Properties:
      Description: 7even5ive background jobs (reminders, calls, college mail, Classroom)
      ScheduleExpression: rate(1 minute)
      State: !If [Tick, ENABLED, DISABLED]
      Targets:
        - Id: tick
          Arn: !GetAtt ApiFunction.Arn
          Input: '{"seventy5": "tick"}'

  TickPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TickRule.Arn

Outputs:
  AppUrl:
    Description: Put this in android/gradle.properties as sevenfive.defaultServer.
    Value: !GetAtt HttpApi.ApiEndpoint
  HealthCheck:
    Description: Answers {"service":"7even5ive","version":1}; the first call takes a few seconds.
    Value: !Sub ${HttpApi.ApiEndpoint}/api/health
  McpUrl:
    Description: >-
      MCP for Claude Code and Codex (claude mcp add --transport http 7even5ive <this>; codex mcp
      add 7even5ive --url <this>): the student signs in in the browser (connector.py).
    Value: !Sub ${HttpApi.ApiEndpoint}/mcp
  GoogleRedirectUri:
    Description: Add this as an Authorized redirect URI on the Google OAuth client (Web application).
    Value: !Sub ${HttpApi.ApiEndpoint}/api/google/callback
  CallWebhookUrl:
    Description: ElevenLabs post-call webhook (HMAC) for the urgent call's outcome.
    Value: !Sub ${HttpApi.ApiEndpoint}/api/calls/webhook
  BotWebhookUrl:
    Description: SEVENTY5_WEBHOOK_URL on the WhatsApp bot (SHELF).
    Value: !Sub ${HttpApi.ApiEndpoint}/bot/webhook
